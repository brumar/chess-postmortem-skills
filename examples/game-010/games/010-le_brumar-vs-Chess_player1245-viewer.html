<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGN Analyzer — viewer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>♞</text></svg>">
<style>
  :root {
    --bg: #161512;
    --panel: #262421;
    --panel2: #302e2c;
    --text: #bababa;
    --text-dim: #787672;
    --accent: #3692e7;
    --light-sq: #f0d9b5;
    --dark-sq: #b58863;
    --sel: rgba(20, 85, 30, 0.5);
    --lastmove: rgba(155, 199, 0, 0.41);
    --good: #22ac38;
    --brilliant: #168226;
    --interesting: #ea45d8;
    --dubious: #e6b400;
    --mistake: #e69f00;
    --blunder: #df5353;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 "Noto Sans", "Segoe UI", system-ui, sans-serif; height: 100%; }
  #app { display: flex; gap: 14px; justify-content: center; align-items: flex-start;
    padding: 12px; max-width: 1200px; margin: 0 auto; }

  /* ---------- left column: eval bar + board + graph + controls ---------- */
  .left { flex: 0 0 auto; }
  .board-row { display: flex; gap: 8px; }
  #evalbar { width: 24px; border-radius: 3px; overflow: hidden; background: #403d39;
    position: relative; cursor: default; }
  #evalbar .white-fill { position: absolute; bottom: 0; left: 0; right: 0;
    background: #eee; transition: height .3s; height: 50%; }
  #evalbar .zero { position: absolute; top: 50%; left: 0; right: 0; height: 2px;
    background: #d64f00; opacity: .8; }
  #evalbar .txt { position: absolute; left: 0; right: 0; text-align: center;
    font-size: 9px; font-weight: bold; z-index: 2; }
  #evalbar .txt.w { bottom: 2px; color: #333; }
  #evalbar .txt.b { top: 2px; color: #ddd; }

  #board-wrap { position: relative; width: var(--bs); height: var(--bs);
    user-select: none; touch-action: manipulation; }
  #board { position: absolute; inset: 0; border-radius: 3px; overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #board .sq { position: absolute; width: 12.5%; height: 12.5%; }
  #board .sq.light { background: var(--light-sq); }
  #board .sq.dark  { background: var(--dark-sq); }
  #board .sq.lastmove { background-color: var(--lastmove); background-blend-mode: normal; }
  #board .sq.light.lastmove { background: linear-gradient(var(--lastmove), var(--lastmove)), var(--light-sq); }
  #board .sq.dark.lastmove  { background: linear-gradient(var(--lastmove), var(--lastmove)), var(--dark-sq); }
  #board .sq.selected { background: linear-gradient(var(--sel), var(--sel)), var(--light-sq); }
  #board .sq.dark.selected { background: linear-gradient(var(--sel), var(--sel)), var(--dark-sq); }
  #board .sq.check { background: radial-gradient(ellipse at center,
      rgba(255,0,0,.9) 0%, rgba(231,0,0,.55) 35%, rgba(169,0,0,0) 70%); }
  #board .sq .dest { position: absolute; inset: 34%; border-radius: 50%;
    background: rgba(20,85,30,.45); pointer-events: none; }
  #board .sq .dest.capture { inset: 0; background: none; border-radius: 0;
    background: radial-gradient(transparent 0%, transparent 74%, rgba(20,85,30,.5) 76%); }
  #board .coord { position: absolute; font-size: 10px; font-weight: 600; opacity: .8;
    pointer-events: none; }
  #board .coord.rank { right: 2px; }
  #board .coord.file { bottom: 1px; left: 3px; }
  #board .coord.on-light { color: var(--dark-sq); }
  #board .coord.on-dark { color: var(--light-sq); }

  #pieces { position: absolute; inset: 0; pointer-events: none; }
  .piece { position: absolute; width: 12.5%; height: 12.5%;
    background-size: cover; will-change: transform;
    transition: transform .12s ease-out; z-index: 2; }
  .piece.dragless { transition: none; }

  #arrows { position: absolute; inset: 0; pointer-events: none; z-index: 3; }

  #promo { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 10;
    display: none; align-items: center; justify-content: center; gap: 8px; }
  #promo.open { display: flex; }
  #promo .choice { width: 15%; padding-top: 15%; position: relative;
    background: #f0d9b5; border-radius: 6px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #promo .choice:hover { background: #fff; }
  #promo .choice div { position: absolute; inset: 5%; background-size: cover; }

  #graph-wrap { margin-top: 8px; position: relative; }
  #graph { display: block; width: 100%; height: 90px; background: var(--panel);
    border-radius: 3px; cursor: crosshair; }
  #graph-tip { position: absolute; top: -22px; left: 0; background: #000c;
    padding: 1px 7px; border-radius: 3px; font-size: 11px; pointer-events: none;
    display: none; white-space: nowrap; z-index: 5; }

  #controls { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  #controls button { flex: 1; background: var(--panel); color: var(--text);
    border: none; border-radius: 3px; padding: 7px 0; font-size: 15px;
    cursor: pointer; }
  #controls button:hover { background: var(--panel2); color: #fff; }
  #controls button.small { flex: 0 0 auto; padding: 7px 12px; font-size: 12px; }

  /* ---------- right column ---------- */
  .right { flex: 1 1 420px; min-width: 320px; max-width: 480px; display: flex;
    flex-direction: column; gap: 10px; max-height: calc(100vh - 24px); }
  .box { background: var(--panel); border-radius: 4px; }

  #meta { padding: 8px 12px; }
  #meta .players { font-size: 15px; font-weight: 600; color: #ddd; }
  #meta .sub { color: var(--text-dim); font-size: 12px; }

  /* engine */
  #engine-box { padding: 8px 12px; }
  #engine-head { display: flex; align-items: center; gap: 10px; }
  #engine-eval { font-size: 20px; font-weight: 700; color: #fff; min-width: 64px; }
  #engine-meta { flex: 1; color: var(--text-dim); font-size: 11px; line-height: 1.3; }
  .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .knob { position: absolute; inset: 0; background: #555; border-radius: 22px;
    cursor: pointer; transition: .2s; }
  .switch .knob:before { content: ""; position: absolute; width: 16px; height: 16px;
    left: 3px; top: 3px; background: #ddd; border-radius: 50%; transition: .2s; }
  .switch input:checked + .knob { background: var(--good); }
  .switch input:checked + .knob:before { transform: translateX(18px); }
  .switch input:disabled + .knob { opacity: .4; cursor: not-allowed; }
  #pvs { margin-top: 6px; display: none; }
  #pvs .pv { display: flex; gap: 8px; padding: 3px 0; border-top: 1px solid #ffffff12;
    font-size: 12px; cursor: pointer; align-items: baseline; }
  #pvs .pv:hover { background: #ffffff08; }
  #pvs .pv .score { font-weight: 700; color: #ddd; min-width: 44px; text-align: right;
    flex: 0 0 auto; font-size: 12px; }
  #pvs .pv .line { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #engine-hint { margin-top: 6px; font-size: 11px; color: var(--dubious); display: none; }
  #engine-actions { margin-top: 6px; display: none; }
  #engine-actions button { background: var(--panel2); border: none; color: var(--text);
    border-radius: 3px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  #engine-actions button:hover { color: #fff; }

  /* move list */
  #moves-box { flex: 1; overflow-y: auto; padding: 10px 12px; min-height: 180px; }
  #moves-box::-webkit-scrollbar { width: 8px; }
  #moves-box::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
  .movetext { line-height: 1.9; }
  .mv { display: inline-block; padding: 0 4px; border-radius: 3px; cursor: pointer;
    color: #ccc; font-weight: 500; white-space: nowrap; }
  .mv:hover { background: var(--accent); color: #fff; }
  .mv.current { background: var(--accent); color: #fff; }
  .mv .glyph { font-weight: 700; }
  .mv.nag1 { color: var(--good); }
  .mv.nag2 { color: var(--mistake); }
  .mv.nag3 { color: var(--brilliant); }
  .mv.nag4 { color: var(--blunder); }
  .mv.nag5 { color: var(--interesting); }
  .mv.nag6 { color: var(--dubious); }
  .mvnum { color: var(--text-dim); font-size: 12px; margin-right: 1px; }
  .cmt { color: #939190; font-style: italic; font-size: 12.5px; }
  .gamecmt { display: block; color: #939190; font-style: italic; font-size: 12.5px;
    border-left: 3px solid #555; padding-left: 8px; margin: 4px 0 8px; }
  .var { display: block; border-left: 2px solid #4a4844; margin: 2px 0 2px calc(10px * var(--d, 1));
    padding-left: 8px; font-size: 13px; line-height: 1.8; }
  .var .mv { color: #a8a6a4; font-size: 13px; }
  .result { font-weight: 700; color: #ddd; margin-left: 6px; }

  #footer-bar { display: flex; gap: 6px; padding: 8px 12px; }
  #footer-bar button, #footer-bar a { background: var(--panel2); border: none;
    color: var(--text); border-radius: 3px; padding: 5px 12px; font-size: 12px;
    cursor: pointer; text-decoration: none; }
  #footer-bar button:hover, #footer-bar a:hover { color: #fff; }
  .spacer { flex: 1; }

  /* load dialog */
  dialog { background: var(--panel); color: var(--text); border: 1px solid #444;
    border-radius: 6px; max-width: 560px; width: 90vw; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 10px; color: #ddd; }
  dialog label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--text-dim); }
  dialog select, dialog textarea, dialog input[type=file] { width: 100%;
    background: var(--bg); color: var(--text); border: 1px solid #444;
    border-radius: 3px; padding: 6px; font-size: 12px; }
  dialog textarea { height: 140px; font-family: monospace; resize: vertical; }
  dialog .row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
  dialog .row button { background: var(--panel2); border: none; color: var(--text);
    border-radius: 3px; padding: 7px 16px; cursor: pointer; }
  dialog .row button.primary { background: var(--accent); color: #fff; }
  #load-error { color: var(--blunder); font-size: 12px; margin-top: 8px; }

  @media (max-width: 900px) {
    #app { flex-direction: column; align-items: center; }
    .right { max-width: none; width: 100%; max-height: none; }
    #moves-box { max-height: 45vh; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="left">
    <div class="board-row">
      <div id="evalbar" title="evaluation">
        <div class="white-fill"></div><div class="zero"></div>
        <div class="txt w"></div><div class="txt b"></div>
      </div>
      <div id="board-wrap">
        <div id="board"></div>
        <div id="pieces"></div>
        <svg id="arrows" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="promo"></div>
      </div>
    </div>
    <div id="graph-wrap">
      <canvas id="graph"></canvas>
      <div id="graph-tip"></div>
    </div>
    <div id="controls">
      <button id="btn-first" title="First (Home)">⏮</button>
      <button id="btn-prev" title="Previous (←)">◀</button>
      <button id="btn-next" title="Next (→)">▶</button>
      <button id="btn-last" title="Last (End)">⏭</button>
      <button id="btn-flip" class="small" title="Flip board (f)">⇅ Flip</button>
    </div>
  </div>

  <div class="right">
    <div id="meta" class="box">
      <div class="players">—</div>
      <div class="sub"></div>
    </div>

    <div id="engine-box" class="box">
      <div id="engine-head">
        <label class="switch" title="Toggle local Stockfish">
          <input type="checkbox" id="engine-toggle"><span class="knob"></span>
        </label>
        <div id="engine-eval">—</div>
        <div id="engine-meta">Local Stockfish (off)</div>
      </div>
      <div id="pvs"></div>
      <div id="engine-actions"><button id="btn-sweep">Compute eval graph (depth 14)</button></div>
      <div id="engine-hint"></div>
    </div>

    <div id="moves-box" class="box"><div class="movetext" id="movetext"></div></div>

    <div id="footer-bar" class="box">
      <button id="btn-load">Load PGN…</button>
      <span class="spacer"></span>
      <a id="btn-lichess" href="https://lichess.org/paste" target="_blank" rel="noopener"
         title="Open this game on lichess">↗ lichess</a>
    </div>
  </div>
</div>

<dialog id="load-dialog">
  <h3>Load a game</h3>
  <label>Embedded games</label>
  <select id="game-select"></select>
  <label>…or paste a PGN</label>
  <textarea id="pgn-input" placeholder="[Event &quot;...&quot;]&#10;&#10;1. e4 c5 2. Nf3 ..."></textarea>
  <label>…or pick files (PGN, plus optional JSONs: sweep for the eval graph,
    analysis sidecar for cached engine lines)</label>
  <input type="file" id="file-input" accept=".pgn,.txt,.json" multiple>
  <div id="load-error"></div>
  <div class="row">
    <button id="btn-cancel">Cancel</button>
    <button id="btn-do-load" class="primary">Load</button>
  </div>
</dialog>

/* this function is used to uniquely identify ambiguous moves */
function get_disambiguator(move, moves) {
  var from = move.from
  var to = move.to
  var piece = move.piece

  var ambiguities = 0
  var same_rank = 0
  var same_file = 0

  for (var i = 0, len = moves.length; i < len; i++) {
    var ambig_from = moves[i].from
    var ambig_to = moves[i].to
    var ambig_piece = moves[i].piece

    /* if a move of the same piece type ends on the same to square, we'll
     * need to add a disambiguator to the algebraic notation
     */
    if (piece === ambig_piece && from !== ambig_from && to === ambig_to) {
      ambiguities++

      if (rank(from) === rank(ambig_from)) {
        same_rank++
      }

      if (file(from) === file(ambig_from)) {
        same_file++
      }
    }
  }

  if (ambiguities > 0) {
    /* if there exists a similar moving piece on the same rank and file as
     * the move in question, use the square as the disambiguator
     */
    if (same_rank > 0 && same_file > 0) {
      return algebraic(from)
    } else if (same_file > 0) {
      /* if the moving piece rests on the same file, use the rank symbol as the
       * disambiguator
       */
      return algebraic(from).charAt(1)
    } else {
      /* else use the file symbol */
      return algebraic(from).charAt(0)
    }
  }

  return ''
}

function infer_piece_type(san) {
  var piece_type = san.charAt(0)
  if (piece_type >= 'a' && piece_type <= 'h') {
    var matches = san.match(/[a-h]\d.*[a-h]\d/)
    if (matches) {
      return undefined
    }
    return PAWN
  }
  piece_type = piece_type.toLowerCase()
  if (piece_type === 'o') {
    return KING
  }
  return piece_type
}

// parses all of the decorators out of a SAN string
function stripped_san(move) {
  return move.replace(/=/, '').replace(/[+#]?[?!]*$/, '')
}

/*****************************************************************************
 * UTILITY FUNCTIONS
 ****************************************************************************/
function rank(i) {
  return i >> 4
}

function file(i) {
  return i & 15
}

function algebraic(i) {
  var f = file(i),
    r = rank(i)
  return 'abcdefgh'.substring(f, f + 1) + '87654321'.substring(r, r + 1)
}

function swap_color(c) {
  return c === WHITE ? BLACK : WHITE
}

function is_digit(c) {
  return '0123456789'.indexOf(c) !== -1
}

function clone(obj) {
  var dupe = obj instanceof Array ? [] : {}

  for (var property in obj) {
    if (typeof property === 'object') {
      dupe[property] = clone(obj[property])
    } else {
      dupe[property] = obj[property]
    }
  }

  return dupe
}

function trim(str) {
  return str.replace(/^\s+|\s+$/g, '')
}

/***************************************************************************
 * PUBLIC CONSTANTS
 **************************************************************************/

const BLACK = 'b'
const WHITE = 'w'

const EMPTY = -1

const PAWN = 'p'
const KNIGHT = 'n'
const BISHOP = 'b'
const ROOK = 'r'
const QUEEN = 'q'
const KING = 'k'

const SQUARES = (function () {
  /* from the ECMA-262 spec (section 12.6.4):
   * "The mechanics of enumerating the properties ... is
   * implementation dependent"
   * so: for (var sq in SQUARES) { keys.push(sq); } might not be
   * ordered correctly
   */
  var keys = []
  for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
    if (i & 0x88) {
      i += 7
      continue
    }
    keys.push(algebraic(i))
  }
  return keys
})()

const FLAGS = {
  NORMAL: 'n',
  CAPTURE: 'c',
  BIG_PAWN: 'b',
  EP_CAPTURE: 'e',
  PROMOTION: 'p',
  KSIDE_CASTLE: 'k',
  QSIDE_CASTLE: 'q',
}

const Chess = function (fen) {
  var board = new Array(128)
  var kings = { w: EMPTY, b: EMPTY }
  var turn = WHITE
  var castling = { w: 0, b: 0 }
  var ep_square = EMPTY
  var half_moves = 0
  var move_number = 1
  var history = []
  var header = {}
  var comments = {}

  /* if the user passes in a fen string, load it, else default to
   * starting position
   */
  if (typeof fen === 'undefined') {
    load(DEFAULT_POSITION)
  } else {
    load(fen)
  }

  function clear(keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    board = new Array(128)
    kings = { w: EMPTY, b: EMPTY }
    turn = WHITE
    castling = { w: 0, b: 0 }
    ep_square = EMPTY
    half_moves = 0
    move_number = 1
    history = []
    if (!keep_headers) header = {}
    comments = {}
    update_setup(generate_fen())
  }

  function prune_comments() {
    var reversed_history = []
    var current_comments = {}
    var copy_comment = function (fen) {
      if (fen in comments) {
        current_comments[fen] = comments[fen]
      }
    }
    while (history.length > 0) {
      reversed_history.push(undo_move())
    }
    copy_comment(generate_fen())
    while (reversed_history.length > 0) {
      make_move(reversed_history.pop())
      copy_comment(generate_fen())
    }
    comments = current_comments
  }

  function reset() {
    load(DEFAULT_POSITION)
  }

  function load(fen, keep_headers) {
    if (typeof keep_headers === 'undefined') {
      keep_headers = false
    }

    var tokens = fen.split(/\s+/)
    var position = tokens[0]
    var square = 0

    if (!validate_fen(fen).valid) {
      return false
    }

    clear(keep_headers)

    for (var i = 0; i < position.length; i++) {
      var piece = position.charAt(i)

      if (piece === '/') {
        square += 8
      } else if (is_digit(piece)) {
        square += parseInt(piece, 10)
      } else {
        var color = piece < 'a' ? WHITE : BLACK
        put({ type: piece.toLowerCase(), color: color }, algebraic(square))
        square++
      }
    }

    turn = tokens[1]

    if (tokens[2].indexOf('K') > -1) {
      castling.w |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('Q') > -1) {
      castling.w |= BITS.QSIDE_CASTLE
    }
    if (tokens[2].indexOf('k') > -1) {
      castling.b |= BITS.KSIDE_CASTLE
    }
    if (tokens[2].indexOf('q') > -1) {
      castling.b |= BITS.QSIDE_CASTLE
    }

    ep_square = tokens[3] === '-' ? EMPTY : SQUARE_MAP[tokens[3]]
    half_moves = parseInt(tokens[4], 10)
    move_number = parseInt(tokens[5], 10)

    update_setup(generate_fen())

    return true
  }

  /* TODO: this function is pretty much crap - it validates structure but
   * completely ignores content (e.g. doesn't verify that each side has a king)
   * ... we should rewrite this, and ditch the silly error_number field while
   * we're at it
   */
  function validate_fen(fen) {
    var errors = {
      0: 'No errors.',
      1: 'FEN string must contain six space-delimited fields.',
      2: '6th field (move number) must be a positive integer.',
      3: '5th field (half move counter) must be a non-negative integer.',
      4: '4th field (en-passant square) is invalid.',
      5: '3rd field (castling availability) is invalid.',
      6: '2nd field (side to move) is invalid.',
      7: "1st field (piece positions) does not contain 8 '/'-delimited rows.",
      8: '1st field (piece positions) is invalid [consecutive numbers].',
      9: '1st field (piece positions) is invalid [invalid piece].',
      10: '1st field (piece positions) is invalid [row too large].',
      11: 'Illegal en-passant square',
    }

    /* 1st criterion: 6 space-seperated fields? */
    var tokens = fen.split(/\s+/)
    if (tokens.length !== 6) {
      return { valid: false, error_number: 1, error: errors[1] }
    }

    /* 2nd criterion: move number field is a integer value > 0? */
    if (isNaN(parseInt(tokens[5])) || parseInt(tokens[5], 10) <= 0) {
      return { valid: false, error_number: 2, error: errors[2] }
    }

    /* 3rd criterion: half move counter is an integer >= 0? */
    if (isNaN(parseInt(tokens[4])) || parseInt(tokens[4], 10) < 0) {
      return { valid: false, error_number: 3, error: errors[3] }
    }

    /* 4th criterion: 4th field is a valid e.p.-string? */
    if (!/^(-|[abcdefgh][36])$/.test(tokens[3])) {
      return { valid: false, error_number: 4, error: errors[4] }
    }

    /* 5th criterion: 3th field is a valid castle-string? */
    if (!/^(KQ?k?q?|Qk?q?|kq?|q|-)$/.test(tokens[2])) {
      return { valid: false, error_number: 5, error: errors[5] }
    }

    /* 6th criterion: 2nd field is "w" (white) or "b" (black)? */
    if (!/^(w|b)$/.test(tokens[1])) {
      return { valid: false, error_number: 6, error: errors[6] }
    }

    /* 7th criterion: 1st field contains 8 rows? */
    var rows = tokens[0].split('/')
    if (rows.length !== 8) {
      return { valid: false, error_number: 7, error: errors[7] }
    }

    /* 8th criterion: every row is valid? */
    for (var i = 0; i < rows.length; i++) {
      /* check for right sum of fields AND not two numbers in succession */
      var sum_fields = 0
      var previous_was_number = false

      for (var k = 0; k < rows[i].length; k++) {
        if (!isNaN(rows[i][k])) {
          if (previous_was_number) {
            return { valid: false, error_number: 8, error: errors[8] }
          }
          sum_fields += parseInt(rows[i][k], 10)
          previous_was_number = true
        } else {
          if (!/^[prnbqkPRNBQK]$/.test(rows[i][k])) {
            return { valid: false, error_number: 9, error: errors[9] }
          }
          sum_fields += 1
          previous_was_number = false
        }
      }
      if (sum_fields !== 8) {
        return { valid: false, error_number: 10, error: errors[10] }
      }
    }

    if (
      (tokens[3][1] == '3' && tokens[1] == 'w') ||
      (tokens[3][1] == '6' && tokens[1] == 'b')
    ) {
      return { valid: false, error_number: 11, error: errors[11] }
    }

    /* everything's okay! */
    return { valid: true, error_number: 0, error: errors[0] }
  }

  function generate_fen() {
    var empty = 0
    var fen = ''

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      if (board[i] == null) {
        empty++
      } else {
        if (empty > 0) {
          fen += empty
          empty = 0
        }
        var color = board[i].color
        var piece = board[i].type

        fen += color === WHITE ? piece.toUpperCase() : piece.toLowerCase()
      }

      if ((i + 1) & 0x88) {
        if (empty > 0) {
          fen += empty
        }

        if (i !== SQUARE_MAP.h1) {
          fen += '/'
        }

        empty = 0
        i += 8
      }
    }

    var cflags = ''
    if (castling[WHITE] & BITS.KSIDE_CASTLE) {
      cflags += 'K'
    }
    if (castling[WHITE] & BITS.QSIDE_CASTLE) {
      cflags += 'Q'
    }
    if (castling[BLACK] & BITS.KSIDE_CASTLE) {
      cflags += 'k'
    }
    if (castling[BLACK] & BITS.QSIDE_CASTLE) {
      cflags += 'q'
    }

    /* do we have an empty castling flag? */
    cflags = cflags || '-'
    var epflags = ep_square === EMPTY ? '-' : algebraic(ep_square)

    return [fen, turn, cflags, epflags, half_moves, move_number].join(' ')
  }

  function set_header(args) {
    for (var i = 0; i < args.length; i += 2) {
      if (typeof args[i] === 'string' && typeof args[i + 1] === 'string') {
        header[args[i]] = args[i + 1]
      }
    }
    return header
  }

  /* called when the initial board setup is changed with put() or remove().
   * modifies the SetUp and FEN properties of the header object.  if the FEN is
   * equal to the default position, the SetUp and FEN are deleted
   * the setup is only updated if history.length is zero, ie moves haven't been
   * made.
   */
  function update_setup(fen) {
    if (history.length > 0) return

    if (fen !== DEFAULT_POSITION) {
      header['SetUp'] = '1'
      header['FEN'] = fen
    } else {
      delete header['SetUp']
      delete header['FEN']
    }
  }

  function get(square) {
    var piece = board[SQUARE_MAP[square]]
    return piece ? { type: piece.type, color: piece.color } : null
  }

  function put(piece, square) {
    /* check for valid piece object */
    if (!('type' in piece && 'color' in piece)) {
      return false
    }

    /* check for piece */
    if (SYMBOLS.indexOf(piece.type.toLowerCase()) === -1) {
      return false
    }

    /* check for valid square */
    if (!(square in SQUARE_MAP)) {
      return false
    }

    var sq = SQUARE_MAP[square]

    /* don't let the user place more than one king */
    if (
      piece.type == KING &&
      !(kings[piece.color] == EMPTY || kings[piece.color] == sq)
    ) {
      return false
    }

    board[sq] = { type: piece.type, color: piece.color }
    if (piece.type === KING) {
      kings[piece.color] = sq
    }

    update_setup(generate_fen())

    return true
  }

  function remove(square) {
    var piece = get(square)
    board[SQUARE_MAP[square]] = null
    if (piece && piece.type === KING) {
      kings[piece.color] = EMPTY
    }

    update_setup(generate_fen())

    return piece
  }

  function build_move(board, from, to, flags, promotion) {
    var move = {
      color: turn,
      from: from,
      to: to,
      flags: flags,
      piece: board[from].type,
    }

    if (promotion) {
      move.flags |= BITS.PROMOTION
      move.promotion = promotion
    }

    if (board[to]) {
      move.captured = board[to].type
    } else if (flags & BITS.EP_CAPTURE) {
      move.captured = PAWN
    }
    return move
  }

  function generate_moves(options) {
    function add_move(board, moves, from, to, flags) {
      /* if pawn promotion */
      if (
        board[from].type === PAWN &&
        (rank(to) === RANK_8 || rank(to) === RANK_1)
      ) {
        var pieces = [QUEEN, ROOK, BISHOP, KNIGHT]
        for (var i = 0, len = pieces.length; i < len; i++) {
          moves.push(build_move(board, from, to, flags, pieces[i]))
        }
      } else {
        moves.push(build_move(board, from, to, flags))
      }
    }

    var moves = []
    var us = turn
    var them = swap_color(us)
    var second_rank = { b: RANK_7, w: RANK_2 }

    var first_sq = SQUARE_MAP.a8
    var last_sq = SQUARE_MAP.h1
    var single_square = false

    /* do we want legal moves? */
    var legal =
      typeof options !== 'undefined' && 'legal' in options
        ? options.legal
        : true

    var piece_type =
      typeof options !== 'undefined' &&
      'piece' in options &&
      typeof options.piece === 'string'
        ? options.piece.toLowerCase()
        : true

    /* are we generating moves for a single square? */
    if (typeof options !== 'undefined' && 'square' in options) {
      if (options.square in SQUARE_MAP) {
        first_sq = last_sq = SQUARE_MAP[options.square]
        single_square = true
      } else {
        /* invalid square */
        return []
      }
    }

    for (var i = first_sq; i <= last_sq; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece == null || piece.color !== us) {
        continue
      }

      if (piece.type === PAWN && (piece_type === true || piece_type === PAWN)) {
        /* single square, non-capturing */
        var square = i + PAWN_OFFSETS[us][0]
        if (board[square] == null) {
          add_move(board, moves, i, square, BITS.NORMAL)

          /* double square */
          var square = i + PAWN_OFFSETS[us][1]
          if (second_rank[us] === rank(i) && board[square] == null) {
            add_move(board, moves, i, square, BITS.BIG_PAWN)
          }
        }

        /* pawn captures */
        for (j = 2; j < 4; j++) {
          var square = i + PAWN_OFFSETS[us][j]
          if (square & 0x88) continue

          if (board[square] != null && board[square].color === them) {
            add_move(board, moves, i, square, BITS.CAPTURE)
          } else if (square === ep_square) {
            add_move(board, moves, i, ep_square, BITS.EP_CAPTURE)
          }
        }
      } else if (piece_type === true || piece_type === piece.type) {
        for (var j = 0, len = PIECE_OFFSETS[piece.type].length; j < len; j++) {
          var offset = PIECE_OFFSETS[piece.type][j]
          var square = i

          while (true) {
            square += offset
            if (square & 0x88) break

            if (board[square] == null) {
              add_move(board, moves, i, square, BITS.NORMAL)
            } else {
              if (board[square].color === us) break
              add_move(board, moves, i, square, BITS.CAPTURE)
              break
            }

            /* break, if knight or king */
            if (piece.type === 'n' || piece.type === 'k') break
          }
        }
      }
    }

    /* check for castling if: a) we're generating all moves, or b) we're doing
     * single square move generation on the king's square
     */
    if (piece_type === true || piece_type === KING) {
      if (!single_square || last_sq === kings[us]) {
        /* king-side castling */
        if (castling[us] & BITS.KSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from + 2

          if (
            board[castling_from + 1] == null &&
            board[castling_to] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from + 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.KSIDE_CASTLE)
          }
        }

        /* queen-side castling */
        if (castling[us] & BITS.QSIDE_CASTLE) {
          var castling_from = kings[us]
          var castling_to = castling_from - 2

          if (
            board[castling_from - 1] == null &&
            board[castling_from - 2] == null &&
            board[castling_from - 3] == null &&
            !attacked(them, kings[us]) &&
            !attacked(them, castling_from - 1) &&
            !attacked(them, castling_to)
          ) {
            add_move(board, moves, kings[us], castling_to, BITS.QSIDE_CASTLE)
          }
        }
      }
    }

    /* return all pseudo-legal moves (this includes moves that allow the king
     * to be captured)
     */
    if (!legal) {
      return moves
    }

    /* filter out illegal moves */
    var legal_moves = []
    for (var i = 0, len = moves.length; i < len; i++) {
      make_move(moves[i])
      if (!king_attacked(us)) {
        legal_moves.push(moves[i])
      }
      undo_move()
    }

    return legal_moves
  }

  /* convert a move from 0x88 coordinates to Standard Algebraic Notation
   * (SAN)
   *
   * @param {boolean} sloppy Use the sloppy SAN generator to work around over
   * disambiguation bugs in Fritz and Chessbase.  See below:
   *
   * r1bqkbnr/ppp2ppp/2n5/1B1pP3/4P3/8/PPPP2PP/RNBQK1NR b KQkq - 2 4
   * 4. ... Nge7 is overly disambiguated because the knight on c6 is pinned
   * 4. ... Ne7 is technically the valid SAN
   */
  function move_to_san(move, moves) {
    var output = ''

    if (move.flags & BITS.KSIDE_CASTLE) {
      output = 'O-O'
    } else if (move.flags & BITS.QSIDE_CASTLE) {
      output = 'O-O-O'
    } else {
      if (move.piece !== PAWN) {
        var disambiguator = get_disambiguator(move, moves)
        output += move.piece.toUpperCase() + disambiguator
      }

      if (move.flags & (BITS.CAPTURE | BITS.EP_CAPTURE)) {
        if (move.piece === PAWN) {
          output += algebraic(move.from)[0]
        }
        output += 'x'
      }

      output += algebraic(move.to)

      if (move.flags & BITS.PROMOTION) {
        output += '=' + move.promotion.toUpperCase()
      }
    }

    make_move(move)
    if (in_check()) {
      if (in_checkmate()) {
        output += '#'
      } else {
        output += '+'
      }
    }
    undo_move()

    return output
  }

  function attacked(color, square) {
    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      /* did we run off the end of the board */
      if (i & 0x88) {
        i += 7
        continue
      }

      /* if empty square or wrong color */
      if (board[i] == null || board[i].color !== color) continue

      var piece = board[i]
      var difference = i - square
      var index = difference + 119

      if (ATTACKS[index] & (1 << SHIFTS[piece.type])) {
        if (piece.type === PAWN) {
          if (difference > 0) {
            if (piece.color === WHITE) return true
          } else {
            if (piece.color === BLACK) return true
          }
          continue
        }

        /* if the piece is a knight or a king */
        if (piece.type === 'n' || piece.type === 'k') return true

        var offset = RAYS[index]
        var j = i + offset

        var blocked = false
        while (j !== square) {
          if (board[j] != null) {
            blocked = true
            break
          }
          j += offset
        }

        if (!blocked) return true
      }
    }

    return false
  }

  function king_attacked(color) {
    return attacked(swap_color(color), kings[color])
  }

  function in_check() {
    return king_attacked(turn)
  }

  function in_checkmate() {
    return in_check() && generate_moves().length === 0
  }

  function in_stalemate() {
    return !in_check() && generate_moves().length === 0
  }

  function insufficient_material() {
    var pieces = {}
    var bishops = []
    var num_pieces = 0
    var sq_color = 0

    for (var i = SQUARE_MAP.a8; i <= SQUARE_MAP.h1; i++) {
      sq_color = (sq_color + 1) % 2
      if (i & 0x88) {
        i += 7
        continue
      }

      var piece = board[i]
      if (piece) {
        pieces[piece.type] = piece.type in pieces ? pieces[piece.type] + 1 : 1
        if (piece.type === BISHOP) {
          bishops.push(sq_color)
        }
        num_pieces++
      }
    }

    /* k vs. k */
    if (num_pieces === 2) {
      return true
    } else if (
      /* k vs. kn .... or .... k vs. kb */
      num_pieces === 3 &&
      (pieces[BISHOP] === 1 || pieces[KNIGHT] === 1)
    ) {
      return true
    } else if (num_pieces === pieces[BISHOP] + 2) {
      /* kb vs. kb where any number of bishops are all on the same color */
      var sum = 0
      var len = bishops.length
      for (var i = 0; i < len; i++) {
        sum += bishops[i]
      }
      if (sum === 0 || sum === len) {
        return true
      }
    }

    return false
  }

  function in_threefold_repetition() {
    /* TODO: while this function is fine for casual use, a better
     * implementation would use a Zobrist key (instead of FEN). the
     * Zobrist key would be maintained in the make_move/undo_move functions,
     * avoiding the costly that we do below.
     */
    var moves = []
    var positions = {}
    var repetition = false

    while (true) {
      var move = undo_move()
      if (!move) break
      moves.push(move)
    }

    while (true) {
      /* remove the last two fields in the FEN string, they're not needed
       * when checking for draw by rep */
      var fen = generate_fen().split(' ').slice(0, 4).join(' ')

      /* has the position occurred three or move times */
      positions[fen] = fen in positions ? positions[fen] + 1 : 1
      if (positions[fen] >= 3) {
        repetition = true
      }

      if (!moves.length) {
        break
      }
      make_move(moves.pop())
    }

    return repetition
  }

  function push(move) {
    history.push({
      move: move,
      kings: { b: kings.b, w: kings.w },
      turn: turn,
      castling: { b: castling.b, w: castling.w },
      ep_square: ep_square,
      half_moves: half_moves,
      move_number: move_number,
    })
  }

  function make_move(move) {
    var us = turn
    var them = swap_color(us)
    push(move)

    board[move.to] = board[move.from]
    board[move.from] = null

    /* if ep capture, remove the captured pawn */
    if (move.flags & BITS.EP_CAPTURE) {
      if (turn === BLACK) {
        board[move.to - 16] = null
      } else {
        board[move.to + 16] = null
      }
    }

    /* if pawn promotion, replace with new piece */
    if (move.flags & BITS.PROMOTION) {
      board[move.to] = { type: move.promotion, color: us }
    }

    /* if we moved the king */
    if (board[move.to].type === KING) {
      kings[board[move.to].color] = move.to

      /* if we castled, move the rook next to the king */
      if (move.flags & BITS.KSIDE_CASTLE) {
        var castling_to = move.to - 1
        var castling_from = move.to + 1

            var from = matches[2]
            var to = matches[3]
            var promotion = matches[4]

                SQUARE_MAP[from] == moves[i].from &&
